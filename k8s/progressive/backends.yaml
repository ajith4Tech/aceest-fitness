apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-stable
  template:
    metadata:
      labels:
        app: aceest-stable
    spec:
      containers:
        - name: aceest-fitness
          image: ajith0b1m/aceest-fitness:1.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aceest-stable
spec:
  selector:
    app: aceest-stable
  ports:
    - port: 80
      targetPort: 5000
---
