apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shadow-main
  annotations:
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow.default.svc.cluster.local$request_uri"
spec:
  ingressClassName: nginx
  rules:
    - host: shadow.aceest.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-stable
                port:
                  number: 80
